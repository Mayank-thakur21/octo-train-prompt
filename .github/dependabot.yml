version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # typescript-eslint supports TypeScript < 6.1, and the runtime (CI, Docker) is Node 22:
      # move these majors deliberately, together with their tooling.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # The frontend build image tracks the Node version CI tests with (22).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
