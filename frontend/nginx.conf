# Prompt Engineering Studio - static SPA + reverse proxy to the API.
# Installed as /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged (runs as a non-root user).

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects nginx makes itself (e.g. /api -> /api/) use a relative Location. An absolute
    # one would name the container port (8080), not the published one (3000 in compose).
    absolute_redirect off;

    # Compress static text assets. text/html is always included by nginx;
    # text/event-stream is deliberately absent so SSE is never buffered by gzip.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Container health probe (used by the Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API (JSON and the SSE endpoints /api/runs/stream and /api/compare/stream).
    # No trailing slash on proxy_pass so the /api prefix is forwarded unchanged.
    # The backend sets its own security headers, so none are added here.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Stream tokens to the browser as they arrive (SSE); never cache API responses.
        proxy_buffering off;
        proxy_cache off;

        # Long model calls and streams (backend REQUEST_TIMEOUT_SECONDS defaults to 120 s;
        # compare runs may take up to COMPARE_TOTAL_TIMEOUT_SECONDS = 180 s).
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Matches IMPORT_MAX_BYTES (5 MiB) plus multipart/JSON overhead; the backend enforces exact limits.
        client_max_body_size 6m;

        # When the backend cannot be reached (down, restarting, timed out), nginx would answer
        # with its HTML error page. Answer with the API's JSON envelope instead, so the UI
        # reports "Cannot reach the server.". proxy_intercept_errors stays off: the backend's
        # own 502/503/504 responses (provider errors) pass through unchanged.
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '{"error":{"code":"backend_unavailable","message":"The API server is not reachable. Try again shortly."}}';
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # SPA: serve files when they exist, otherwise index.html (client-side routes).
    # index.html (and other unhashed files) must always be revalidated.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
